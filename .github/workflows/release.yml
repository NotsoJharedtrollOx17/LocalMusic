name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  windows:
    uses: ./.github/workflows/windows-package.yml
  android:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate reviewed release ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - name: Android toolchain
        run: bash .github/scripts/setup-android.sh
      - run: npm ci
      - run: node scripts/check-version.mjs
      - name: Restore private release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/local-music-release.p12"
      - name: Build signed release APK
        env:
          LOCAL_MUSIC_KEYSTORE: ${{ runner.temp }}/local-music-release.p12
          LOCAL_MUSIC_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LOCAL_MUSIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOCAL_MUSIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npm run tauri -- android build --apk --target aarch64 --features custom-protocol
      - name: Verify and stage APK
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p artifacts/release-assets
          apk="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          python3 scripts/verify-release.py --apk "$apk" --native src-tauri/target/aarch64-linux-android/release/liblocal_music_lib.so --output artifacts/release-assets/android-verification.json
          node scripts/verify-embedded-assets.mjs --binary src-tauri/target/aarch64-linux-android/release/liblocal_music_lib.so --build src-tauri/target/aarch64-linux-android/release/build --output artifacts/release-assets/android-frontend.json
          cp "$apk" "artifacts/release-assets/Local-Music-v${version}-android-arm64.apk"
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/local-music-release.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: artifacts/release-assets/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          merge-multiple: true
          path: artifacts/release-assets
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-version.mjs
          cd artifacts/release-assets
          sha256sum Local-* *-frontend.json android-verification.json > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Published release already exists; refusing replacement'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Local Music $GITHUB_REF_NAME" --notes-file "../../docs/releases/$GITHUB_REF_NAME.md"
          fi
          gh release upload "$GITHUB_REF_NAME" Local-* SHA256SUMS.txt *-frontend.json android-verification.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
