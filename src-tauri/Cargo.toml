[package]
name = "local-music"
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
# Keep unwinding: visualizer worker recovery uses catch_unwind.
panic = "unwind"

[lib]
name = "local_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
music-core = { path = "../crates/music-core" }
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-native-music = { path = "plugins/native-music" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Power"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62.2"
